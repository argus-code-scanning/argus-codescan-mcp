# Argus nightly security scan: copy to .github/workflows/argus-scheduled.yml in your repository.
#
# - Runs a full scan every night (02:00 UTC) and on demand (Actions → Run workflow)
# - Uploads SARIF to the Security tab and writes a job summary
# - Opens one issue (label: argus-nightly) when NEW critical findings appear, comments on it
#   when more appear, and closes it when none are left
# - fail-on: the scheduled run only reports; pick a threshold when running it by hand
#
# Pin the action to a commit SHA for supply-chain safety:
#   uses: argus-code-scanning/argus-codescan-mcp@<sha> # v1

name: Argus nightly scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to scan (default branch when empty)
        required: false
        default: ""
      fail-on:
        description: Fail the run at this severity or above
        type: choice
        options: [never, critical, high, medium, low]
        default: never
      notify:
        description: Open an issue for new critical findings
        type: choice
        options: [issue, none]
        default: issue

permissions:
  contents: read
  security-events: write
  issues: write

concurrency:
  group: argus-nightly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - id: argus
        uses: argus-code-scanning/argus-codescan-mcp@v1
        continue-on-error: true
        with:
          scan-type: all
          fail-on: ${{ inputs.fail-on || 'never' }}
          category: argus-nightly

      - name: Issue for new critical findings
        if: always() && steps.argus.outputs.sarif-file != '' && (inputs.notify || 'issue') == 'issue'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SARIF: ${{ steps.argus.outputs.sarif-file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ inputs.ref || github.event.repository.default_branch }}
        with:
          script: |
            const fs = require("fs");
            const LABEL = "argus-nightly";
            const MARKER = "<!-- argus-nightly-keys:";
            const sarif = JSON.parse(fs.readFileSync(process.env.SARIF, "utf8"));
            // Key without the line number, so findings don't look new when code above them moves.
            const critical = new Map();
            for (const run of sarif.runs || []) {
              for (const r of run.results || []) {
                if ((r.properties || {}).severity !== "critical") continue;
                const loc = ((r.locations || [])[0] || {}).physicalLocation || {};
                const file = (loc.artifactLocation || {}).uri || "";
                const line = (loc.region || {}).startLine || 0;
                const text = ((r.message || {}).text || "").slice(0, 200);
                const key = `${r.ruleId}|${file}|${text}`;
                if (!critical.has(key)) critical.set(key, { rule: r.ruleId, file, line, text });
              }
            }
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: LABEL, per_page: 100,
            });
            const issue = open[0];
            const previous = new Set();
            if (issue) {
              const m = (issue.body || "").match(/<!-- argus-nightly-keys:([\s\S]*?)-->/);
              if (m) { try { JSON.parse(m[1]).forEach((k) => previous.add(k)); } catch (e) {} }
            }
            const fresh = [...critical.keys()].filter((k) => !previous.has(k));
            const row = (k) => {
              const f = critical.get(k);
              return `- **${f.rule}** in \`${f.file}${f.line ? `:${f.line}` : ""}\`${f.text ? ` — ${f.text.replace(/\n/g, " ")}` : ""}`;
            };
            const body = [
              `Argus found **${critical.size}** critical finding(s) on \`${process.env.REF}\`.`,
              "",
              ...[...critical.keys()].map(row),
              "",
              `Latest run: ${process.env.RUN_URL}. Full results are in the Security tab (category \`argus-nightly\`).`,
              "",
              `${MARKER}${JSON.stringify([...critical.keys()])}-->`,
            ].join("\n");

            if (critical.size === 0) {
              if (issue) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `No critical findings in the latest nightly scan (${process.env.RUN_URL}). Closing.` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed" });
              }
              core.info("No critical findings.");
              return;
            }
            if (!issue) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: "d73a4a",
                  description: "Critical findings from the Argus nightly scan" });
              } catch (e) { /* label exists */ }
              const created = await github.rest.issues.create({ owner, repo, labels: [LABEL],
                title: `Argus nightly scan: ${critical.size} critical finding(s)`, body });
              core.info(`Opened issue #${created.data.number}`);
              return;
            }
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, body,
              title: `Argus nightly scan: ${critical.size} critical finding(s)` });
            if (fresh.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                body: [`**${fresh.length} new** critical finding(s):`, "", ...fresh.map(row), "", process.env.RUN_URL].join("\n") });
            }
            core.info(`Updated issue #${issue.number}: ${fresh.length} new.`);

      - name: Enforce fail-on
        if: steps.argus.outputs.failed == 'true'
        run: |
          echo "::error::Findings reached the fail-on threshold. See the job summary."
          exit 1
