name: Argus Security Scan (SARIF)

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  # Lets the github-actions bot post the scan summary on pull requests.
  pull-requests: write

# Pull requests scan only files changed since the base commit.
# More than this many changed files falls back to a full repository scan.
env:
  ARGUS_PR_FILE_LIMIT: "50"

jobs:
  argus-sarif:
    name: Argus scan → SARIF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git diff` can see the pull request base SHA.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Argus
        run: |
          pip install -e packages/languages
          pip install -e packages/python

      - name: Resolve changed files
        id: scope
        if: github.event_name == 'pull_request'
        run: |
          argus ci pr-paths \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --limit "${{ env.ARGUS_PR_FILE_LIMIT }}" \
            --output scan-paths.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Scan changed files (SAST + secrets)
        if: github.event_name == 'pull_request' && steps.scope.outputs.mode == 'changed'
        run: |
          mkdir -p argus-results
          argus scan sast . \
            --paths-file scan-paths.txt \
            --format sarif \
            --output argus-results/sast.sarif \
            --fail-on never
          argus scan secrets . \
            --paths-file scan-paths.txt \
            --format sarif \
            --output argus-results/secrets.sarif \
            --fail-on never
        continue-on-error: true

      - name: Full repository scan (SAST + secrets)
        if: github.event_name != 'pull_request' || steps.scope.outputs.mode == 'full'
        run: |
          mkdir -p argus-results
          argus scan sast . \
            --format sarif \
            --output argus-results/sast.sarif \
            --fail-on never
          argus scan secrets . \
            --format sarif \
            --output argus-results/secrets.sarif \
            --fail-on never
        continue-on-error: true

      # Code scanning accepts one SARIF run per category, so upload each
      # scan separately.
      - name: Upload SAST SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('argus-results/sast.sarif') != ''
        with:
          sarif_file: argus-results/sast.sarif
          category: argus-sast

      - name: Upload secrets SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('argus-results/secrets.sarif') != ''
        with:
          sarif_file: argus-results/secrets.sarif
          category: argus-secrets

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argus-sarif
          path: argus-results
          if-no-files-found: ignore

      - name: Build PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          # Optional repository variable pointing at the cloud dashboard run.
          ARGUS_DASHBOARD_URL: ${{ vars.ARGUS_DASHBOARD_URL }}
        run: |
          argus ci pr-comment \
            --sarif argus-results/sast.sarif argus-results/secrets.sarif \
            --scope-mode "${{ steps.scope.outputs.mode }}" \
            --changed-count "${{ steps.scope.outputs.changed_count }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --output argus-pr-comment.md
          cat argus-pr-comment.md >> "$GITHUB_STEP_SUMMARY"

      # Fork pull requests get a read-only token, so they only see the job
      # summary. The bot edits its earlier comment instead of adding new ones.
      - name: Post PR comment
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('argus-pr-comment.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('argus-pr-comment.md', 'utf8');
            const marker = '<!-- argus-pr-comment -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
