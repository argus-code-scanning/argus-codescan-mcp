name: npm CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
    paths:
      - 'packages/npm/**'
      - '.github/workflows/ci-npm.yml'
      # Rule packs shared with argus-codescan (tests check the generated file is current)
      - 'packages/languages/src/argus_languages/bundled_rules/cookies.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pii.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pii-hardcoded.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pci-pan.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/privacy-gdpr.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/header-injection.yaml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/npm/**'
      - '.github/workflows/ci-npm.yml'
      # Rule packs shared with argus-codescan (tests check the generated file is current)
      - 'packages/languages/src/argus_languages/bundled_rules/cookies.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pii.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pii-hardcoded.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/pci-pan.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/privacy-gdpr.yaml'
      - 'packages/languages/src/argus_languages/bundled_rules/header-injection.yaml'

defaults:
  run:
    working-directory: packages/npm

jobs:
  build-and-test:
    name: Build & test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: ['20', '22', '24']
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: packages/npm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package contents
        run: npm run check-pack

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) and provenance
    # Map secret → env so `if:` can check it (secrets.* is invalid in if expressions).
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1. Configure it on npmjs.com
      # (package settings → Trusted publisher: this repo, ci-npm.yml, environment npm).
      # See docs/launch/trusted-publishing.md
      # Do NOT set NODE_AUTH_TOKEN to an empty secret — that forces ENEEDAUTH and
      # blocks OIDC. Only pass a token when NPM_TOKEN is actually configured.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public
      - name: Publish to npm (NPM_TOKEN fallback)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
