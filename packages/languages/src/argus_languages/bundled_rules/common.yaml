- id: injection-eval
  title: Dynamic code execution (eval/exec) — injection risk
  severity: high
  pattern: '\beval\s*\(|\bexec\s*\(|\bFunction\s*\(|Runtime\.getRuntime\(\)\.exec'
  languages: [javascript, typescript, python, java, ruby, perl, lua, vue]

- id: sql-concat
  title: Possible SQL injection — string concatenation in query
  severity: high
  pattern: '(SELECT|INSERT|UPDATE|DELETE|query\s*\+|f["''].*SELECT|Statement\.execute\s*\([^)]*\+)'
  flags: [i]
  languages: [javascript, typescript, python, java, ruby, csharp, go, kotlin, scala]

- id: command-injection
  title: Possible command injection — dynamic shell execution
  severity: high
  pattern: >-
    (?x)(?:\bos\.(?:system|popen)\s*\(\s*(?:[A-Za-z_$][\w$]*(?:\s*\([^)]{0,120}\))?|["'][^"']{0,160}["']\s*(?:\+|%|\.format\s*\()|f["'][^"']*\{)|\bsubprocess\.(?:call|Popen|run)\s*\((?:[\s\S]{0,300}?\bshell\s*=\s*True\b|f["']|["'][^"']{0,160}["']\s*(?:\+|%|\.format\s*\())))
  languages: [python]

- id: command-injection
  title: Possible command injection — dynamic shell execution
  severity: high
  pattern: >-
    (?x)(?:(?:\b(?:child_process|childProcess|cp)\.)|(?<![\w$.]))exec(?:Sync)?\s*\(\s*(?:[A-Za-z_$][\w$]*(?:\s*\([^)]{0,120}\))?|["'][^"']{0,160}["']\s*(?:\+|\.format\s*\()|`[^`]{0,160}\$\{))
  languages: [javascript, typescript]

- id: command-injection
  title: Possible command injection — dynamic shell execution
  severity: high
  pattern: >-
    (?x)(?:Runtime\.getRuntime\(\)\.exec\s*\(\s*(?:[A-Za-z_$][\w$]*(?:\s*\([^)]{0,120}\))?|["'][^"']{0,160}["']\s*\+)|new\s+ProcessBuilder\s*\(\s*["'](?:sh|bash|cmd(?:\.exe)?|powershell(?:\.exe)?)["']\s*,\s*["'](?:-c|/c|--command)["']\s*,\s*(?:[A-Za-z_$][\w$]*|["'][^"']{0,160}["']\s*\+))
  languages: [java, kotlin, scala]

- id: command-injection
  title: Possible command injection — dynamic shell execution
  severity: high
  pattern: >-
    (?x)exec\.Command\s*\(\s*["'](?:sh|bash|cmd(?:\.exe)?|powershell(?:\.exe)?)["']\s*,\s*["'](?:-c|/c|--command)["']\s*,\s*(?:[A-Za-z_$][\w$]*|["'][^"']{0,160}["']\s*\+)
  languages: [go]

- id: command-injection
  title: Possible command injection — dynamic shell execution
  severity: high
  pattern: >-
    (?x)(?:Process\.Start\s*\(\s*["'](?:cmd(?:\.exe)?|powershell(?:\.exe)?)["']\s*,\s*(?:["'][^"']{0,160}["']\s*\+|[A-Za-z_$][\w$]*)|\bsystem\s*\(\s*(?:[A-Za-z_$][\w$]*|["'][^"']{0,160}(?:#\{|\$[A-Za-z_])|["'][^"']{0,160}["']\s*\+)|\bsystem\s+\$[A-Za-z_][\w$]*|`[^`]{0,200}(?:#\{|\$[A-Za-z_])|%x.{0,200}(?:#\{|\$[A-Za-z_])|\b(?:sh|bash|zsh)\s+-c\s+["'][^"']{0,160}\$[A-Za-z_])
  languages: [csharp, ruby, perl, shell]

- id: weak-crypto
  title: Weak cryptography (MD5/SHA1/DES/ECB)
  severity: moderate
  pattern: '(\b(MD5|SHA1)(?!_file)|\bDES(ede)?\b|\bECB\b|createHash\s*\(\s*["'']md5|MessageDigest\.getInstance\s*\(\s*["'']MD5|hash\.md5)'
  flags: [i]
  # PHP uses md5/sha1 for cache keys and checksums constantly; php.yaml flags
  # the security-relevant cases (passwords, weak ciphers) instead.
  exclude_languages: [php, blade]

- id: hardcoded-password
  title: Hardcoded password or secret assignment
  severity: high
  pattern: '(password\s*=\s*["''][^"'']{4,}["'']|passwd\s*=\s*["'']|api_key\s*=\s*["''][^"'']+["'']|secret_key\s*=\s*["''][^"'']+["''])'
  flags: [i]

- id: deserialization
  title: Unsafe deserialization
  severity: high
  pattern: '(pickle\.loads|yaml\.load\s*\(|unserialize\s*\(|ObjectInputStream|readObject\s*\()'
  languages: [python, java, php, ruby, csharp, kotlin, scala, rust]

- id: ssrf-fetch
  title: Possible SSRF — URL fetch may use user-controlled input
  severity: moderate
  pattern: '(fetch\s*\([^)]*\+|requests\.(get|post)\s*\([^)]*\+|HttpClient.*\+|file_get_contents\s*\(\s*\$|urllib\.request\.urlopen\s*\([^)]*\+)'
  languages: [javascript, typescript, python, ruby, java, go]

- id: xss-innerhtml
  title: Possible XSS — unsafe HTML insertion
  severity: high
  pattern: '(innerHTML\s*=|dangerouslySetInnerHTML|document\.write\s*\()'
  languages: [javascript, typescript, vue, php]

- id: nosql-injection
  title: Possible NoSQL injection
  severity: high
  pattern: '(\$where|\$regex.*\+|find\s*\(\s*\{[^}]*\$)'
  languages: [javascript, typescript, python]

- id: cors-wildcard
  title: CORS allows all origins (*)
  severity: moderate
  pattern: '(Access-Control-Allow-Origin[''"]\s*,\s*[''"]\*|cors\s*\(\s*\{[^}]*origin\s*:\s*[''"]\*)'
  languages: [javascript, typescript]

- id: path-traversal
  title: Possible path traversal — user input in file path
  severity: moderate
  pattern: '(open\s*\([^)]*\+|readFile\s*\([^)]*\+|include\s*\(\s*\$|require\s*\(\s*\$|new File\s*\([^)]*\+)'
  exclude_languages: [php, blade]
