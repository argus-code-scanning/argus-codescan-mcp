# Access-control rules for web code: Python (Django, Django REST Framework, Flask-Login),
# Java / Kotlin (Spring Security, JSR-250) and C# (ASP.NET Core).
# They flag places where authentication or authorization is explicitly switched off.
# Patterns are line-oriented, so a list or call chain that is split over several lines is only
# caught on the line that names the risky call or class.
# Many of these are intentional (login and signup views must be public), so the
# view-level findings say "review this" rather than "this is a bug".

- id: python-drf-allowany-view
  title: DRF view is open to everyone (AllowAny or empty permission_classes) — fine for login/signup, review anything else
  severity: medium
  pattern: '(\bpermission_classes\s*=\s*[\[(][^\])]*\bAllowAny\b|@permission_classes\(\s*[\[(][^\])]*\bAllowAny\b|\bpermission_classes\s*=\s*[\[(]\s*[\])]|@permission_classes\(\s*[\[(]\s*[\])]\s*\))'
  languages: [python]
  fix_guidance: >-
    Use IsAuthenticated by default and opt specific public views (login, signup,
    health checks) out explicitly, with a comment saying why they are public.

- id: python-drf-empty-auth
  title: DRF view has authentication switched off (empty authentication_classes)
  severity: medium
  pattern: '(\bauthentication_classes\s*=\s*[\[(]\s*[\])]|@authentication_classes\(\s*[\[(]\s*[\])]\s*\))'
  languages: [python]
  fix_guidance: >-
    Keep an authentication class on the view (for example TokenAuthentication or
    SessionAuthentication) so request.user is populated, and use permission_classes
    to decide who may call it.

- id: python-drf-default-allowany
  title: AllowAny is set as a DRF default permission — every view is public unless it overrides it
  severity: high
  pattern: '[''"]rest_framework\.permissions\.AllowAny[''"]'
  languages: [python]
  fix_guidance: >-
    Set DEFAULT_PERMISSION_CLASSES to rest_framework.permissions.IsAuthenticated and
    opt individual public views out explicitly with permission_classes = [AllowAny].

- id: python-django-csrf-exempt
  title: CSRF protection turned off with csrf_exempt — make sure the view does not rely on cookie authentication
  severity: medium
  pattern: '^(?!\s*(from|import)\b)[^#]*\bcsrf_exempt\b'
  languages: [python]
  fix_guidance: >-
    Remove csrf_exempt, or limit it to endpoints that authenticate every request some
    other way (an API token or a signed webhook payload) and verify that signature.

- id: python-flask-login-disabled
  title: Flask-Login is disabled (LOGIN_DISABLED = True) — make sure this is a test-only setting
  severity: high
  pattern: '\bLOGIN_DISABLED\b[''"\]]*\s*=\s*True\b'
  languages: [python]
  fix_guidance: >-
    Keep LOGIN_DISABLED out of production configuration. Enable it only in a test
    config that cannot be selected by an environment variable in a deployed app.

- id: java-spring-permitall-everything
  title: Spring Security permits every request without authentication (permitAll on anyRequest or "/**")
  severity: high
  pattern: '(\.anyRequest\(\)\s*\.permitAll\(\)|\.(requestMatchers|antMatchers|mvcMatchers)\(\s*"/\*\*"\s*\)\s*\.permitAll\(\)|\bauthorize\(\s*anyRequest\s*,\s*permitAll\s*\))'
  languages: [java, kotlin]
  fix_guidance: >-
    End the rule chain with anyRequest().authenticated() and list only the paths that
    really are public (for example "/login" or "/health") in their own requestMatchers.

- id: java-spring-web-ignoring-everything
  title: Spring Security ignores every request (web.ignoring on anyRequest or "/**") — no filters run at all
  severity: high
  pattern: '\.ignoring\(\)\s*\.(anyRequest\(\)|(requestMatchers|antMatchers|mvcMatchers)\(\s*"/\*\*"\s*\))'
  languages: [java, kotlin]
  fix_guidance: >-
    Use web.ignoring() only for static assets (for example "/css/**" and "/images/**") and
    keep every other request inside the security filter chain.

- id: java-jsr250-permitall
  title: "@PermitAll opens this controller or method to everyone — review: is it meant to be public?"
  severity: medium
  pattern: '^(?!\s*(import\b|//|\*)).*@PermitAll\b'
  languages: [java, kotlin]
  fix_guidance: >-
    Prefer @PreAuthorize or @RolesAllowed on the endpoints that need protection, and keep
    @PermitAll only for endpoints that are public by design, with a comment saying why.

- id: dotnet-allowanonymous-attribute
  title: "[AllowAnonymous] opens this controller or action to everyone — review: is it meant to be public?"
  severity: medium
  pattern: '^(?!\s*//).*\[[^\]]*\bAllowAnonymous\b[^\]]*\]'
  languages: [csharp]
  fix_guidance: >-
    Keep [Authorize] on the controller and use [AllowAnonymous] only on endpoints that are
    public by design (login, health checks), with a comment saying why.

- id: dotnet-allowanonymous-endpoint
  title: ".AllowAnonymous() opens this endpoint mapping to everyone — review: is it meant to be public?"
  severity: medium
  pattern: '^(?!\s*//).*\.AllowAnonymous\(\)'
  languages: [csharp]
  fix_guidance: >-
    Use .RequireAuthorization() on the endpoint or group, and call .AllowAnonymous() only
    for endpoints that are public by design.
